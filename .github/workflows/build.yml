name: Build exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pygame-ce pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name Snake --add-data "Bilder_ordner;Bilder_ordner" --add-data "Sounds;Sounds" --add-data "Musik;Musik" main.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Snake-exe
          path: dist/Snake.exe
